{% extends "base.html" %}
{% block title %}Contact — Talhah Khan{% endblock %}
{% block hero %}{% endblock %}

{% block content %}
<section class="max-w-3xl mx-auto">
  <article class="p-[1px] rounded-[1.4rem] bg-gradient-to-br from-indigo-500/35 via-violet-500/35 to-fuchsia-500/35">
    <div class="ring-gradient shadow-soft overflow-hidden">
      <header class="p-6 pb-0">
        <h1 class="text-3xl font-extrabold tracking-tight">Get in touch</h1>
        <p class="mt-2 text-sm text-neutral-500 dark:text-neutral-400">Reach me by phone or email</p>
      </header>

      <div class="p-6 pt-4 space-y-4">
        <!-- Phone -->
        <div class="flex items-center justify-between gap-3 rounded-2xl border border-neutral-200 dark:border-neutral-800 bg-white/85 dark:bg-neutral-900/60 p-4">
          <div>
            <div class="text-xs uppercase tracking-wide text-neutral-500">Phone</div>
            <a href="tel:+114703703698" class="text-lg font-semibold hover:underline">+1 (470) 370-3698</a>
          </div>
          <button class="text-xs rounded-lg border border-neutral-200 dark:border-neutral-800 px-3 py-1.5 hover:bg-white/60 dark:hover:bg-white/10 transition"
                  data-copy="+14703703698">
            Copy
          </button>
        </div>

        <!-- Email -->
        <div class="flex items-center justify-between gap-3 rounded-2xl border border-neutral-200 dark:border-neutral-800 bg-white/85 dark:bg-neutral-900/60 p-4">
          <div>
            <div class="text-xs uppercase tracking-wide text-neutral-500">Email</div>
            <a href="mailto:talhahsbox@gmail.com" class="text-lg font-semibold hover:underline">talhahsbox@gmail.com</a>
          </div>
          <button class="text-xs rounded-lg border border-neutral-200 dark:border-neutral-800 px-3 py-1.5 hover:bg-white/60 dark:hover:bg-white/10 transition"
                  data-copy="talhahsbox@gmail.com">
            Copy
          </button>
        </div>
      </div>
    </div>
  </article>
</section>
{% endblock %}

{% block extra_js %}
<script>
  // Copy-to-clipboard buttons
  document.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(btn.getAttribute('data-copy'));
        const old = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => (btn.textContent = old), 1200);
      } catch {
        btn.textContent = 'Failed';
        setTimeout(() => (btn.textContent = 'Copy'), 1200);
      }
    });
  });
</script>
{% endblock %}
