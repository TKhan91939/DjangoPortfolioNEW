{% extends "base.html" %}

{% block hero %}{% endblock %}

{% block content %}
<section style="max-width: 1000px; margin: 40px auto; padding: 20px;">
    <h1 style="text-align: center; margin-bottom: 25px; font-size: 32px; font-weight: bold;">
        Resume
    </h1>

    {% if resume_obj %}
        <div style="text-align: center; margin-bottom: 20px;">
            {% if resume_obj.linkedin_url %}
                <a href="{{ resume_obj.linkedin_url }}" target="_blank"
                   style="display: inline-block; margin-right: 12px; padding: 10px 18px; border: 1px solid #ccc; border-radius: 8px; text-decoration: none;">
                    View LinkedIn
                </a>
            {% endif %}

            <a href="{{ resume_obj.resume_pdf.url }}" download
               style="display: inline-block; padding: 10px 18px; border: 1px solid #ccc; border-radius: 8px; text-decoration: none;">
                Download PDF
            </a>
        </div>

        <!-- PDF Viewer -->
        <div style="width: 100%; height: 900px; border: 1px solid #ccc; border-radius: 12px; overflow: hidden; background: white;">
            <object data="{{ resume_obj.resume_pdf.url }}" type="application/pdf" width="100%" height="100%">
                <p style="text-align: center; padding: 20px;">
                    Your browser cannot display the PDF.
                    <br><br>
                    <a href="{{ resume_obj.resume_pdf.url }}" target="_blank">
                        Click here to open it
                    </a>
                </p>
            </object>
        </div>
    {% else %}
        <p style="text-align: center;">No resume uploaded yet.</p>
    {% endif %}
</section>
{% endblock %}
